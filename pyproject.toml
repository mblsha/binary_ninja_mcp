[project]
name = "binary-ninja-mcp"
version = "0.2.8"
description = "Binary Ninja plugin and CLI for LLM-assisted binary analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "plumbum>=1.8.0",
  "requests>=2.32.3",
]

[project.scripts]
binja-cli = "binja_cli.cli:main"
binja-mcp = "binja_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["binja_cli*", "shared*"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/binaryninja-api"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
