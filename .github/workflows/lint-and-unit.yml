name: Lint and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_and_unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Check for hidden Unicode controls
        run: uv run python scripts/check_unicode_safety.py .

      - name: Run offline tests (exclude real-Binja)
        run: uv run --frozen --extra search python -m pytest -q -m "not binja"

      - name: Ruff check
        run: uv tool run ruff@0.14.10 check --output-format=github .

      - name: Ruff format
        run: uv tool run ruff@0.14.10 format --check .

  cli_portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Test client contracts without Binary Ninja
        run: uv run --frozen --extra search python -m pytest -q test_cli_packaging_unit.py test_cli_output_unit.py test_cli_python_sources_unit.py test_cli_schema_unit.py test_analysis_primitives_unit.py test_analysis_queries_unit.py test_annotation_edits_unit.py
      - name: Build and smoke-test installed CLI
        run: |
          uv build
          uv run --frozen python scripts/smoke_cli_wheel.py "dist/*.whl"
